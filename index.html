<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SideFin: see your OrcaSlicer profiles next to your printer maker's defaults, per nozzle." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SideFin</title>
    <script>
      // Light, Dark or System, chosen in the header; set before the page draws, so it does not flash.
      try {
        var t = localStorage.getItem('sidefin.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
